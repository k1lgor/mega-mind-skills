site_name: Mega-Mind Skills
site_description: 53 skills, 11 agent personas, and 9 workflows for any AI coding assistant
site_url: https://k1lgor.github.io/mega-mind-skills
repo_url: https://github.com/k1lgor/mega-mind-skills
edit_uri: blob/main/docs-site/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - content.code.copy
    - content.tabs.link

docs_dir: docs-site

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables

nav:
  - Home: index.md
  - Installation: installation.md
  - Reference: reference.md
  - Changelog: changelog.md
