[project]
name = "mmo"
version = "0.8.0"
description = "A powerful AI orchestrator and skill system for any AI coding agent (Antigravity, Claude Code, GitHub Copilot, Cursor, OpenCode, Codex, pi, and more). Featuring 53 specialized skills, 11 agent personas, 9 executable workflows, and comprehensive lifecycle coverage from planning through production operations."
authors = [
    { name = "Plamen Ivanov", email = "paco.iwanow@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
]

[project.scripts]
mega-mind-orchestrator = "mega_mind.cli:main"
mmo = "mega_mind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mega_mind"]
