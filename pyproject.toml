[project]
name = "mmo"
version = "1.0.3"
description = "The most powerful AI skill system on GitHub — 53 Gold Standard v2.0 skills, 11 agent personas, and 9 executable workflows for any AI coding agent (Antigravity, Claude Code, Copilot, OpenCode, Codex, pi, and Agent Skills-compatible tools)."
authors = [
    { name = "Plamen Ivanov", email = "paco.iwanow@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mega-mind-orchestrator = "mega_mind.cli:main"
mmo = "mega_mind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mega_mind"]
